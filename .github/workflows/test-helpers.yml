---
on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '*'

name: "Test CI helpers"

jobs:
  perl-versions:
    name:               "List perl versions"
    runs-on:            ubuntu-latest
    outputs:
      bookworm:         ${{ steps.action.outputs.versions-target-perl-bookworm }}
      bullseye:         ${{ steps.action.outputs.versions-target-perl-bullseye }}
      buster:           ${{ steps.action.outputs.versions-target-perl-buster }}
      trixie:           ${{ steps.action.outputs.versions-target-perl-trixie }}
    steps:
      - id:             action
        name:           Perl versions action step
        uses:           perl-actions/multi-target-perl-versions@v2
        with:
          since-perl:                '5.8'
          with-target-perl-bookworm: 'true'
          with-target-perl-bullseye: 'true'
          with-target-perl-buster:   'true'
          with-target-perl-trixie:   'true'

  test-buster:
    name:               "Test on buster"
    runs-on:            ubuntu-latest
    needs:
      - perl-versions
    strategy:
      fail-fast:        true
      matrix:
        perl-version:   ${{ fromJSON (needs.perl-versions.outputs.buster) }}
        foundation:     [ "buster" ]
    container:
      image:            perl:${{matrix.perl-version}}-${{matrix.foundation}}
    steps:
      - uses:           actions/checkout@v6
      - uses:           ./install-test-helper-deps/
      - run:            "cpm install CPAN::Test::Dummy::Perl5::Make"
        shell:          bash

  test-bullseye:
    name:               "Test on bullseye"
    runs-on:            ubuntu-latest
    needs:
      - perl-versions
    strategy:
      fail-fast:        true
      matrix:
        perl-version:   ${{ fromJSON (needs.perl-versions.outputs.bullseye) }}
        foundation:     [ "slim-bullseye" ]
        include:
          # perl:5.30-slim-bullseye is missing tools required to finish this task
          - perl-version:   "5.30"
            foundation:     "slim-bullseye"
            extra-packages: "wget"
    container:
      image:            perl:${{matrix.perl-version}}-${{matrix.foundation}}
    steps:
      - uses:           actions/checkout@v6
      - name:           Install extra Debian packages
        if: matrix.extra-packages != ''
        run: |
          apt-get update
          apt-get install -y ${{ matrix.extra-packages }}
      - uses:           ./install-test-helper-deps/
      - run:            "cpm install CPAN::Test::Dummy::Perl5::Make"
        shell:          bash

  test-bookworm:
    name:               "Test on bookworm"
    runs-on:            ubuntu-latest
    needs:
      - perl-versions
    strategy:
      fail-fast:        true
      matrix:
        perl-version:   ${{ fromJSON (needs.perl-versions.outputs.bookworm) }}
        foundation:     [ "slim-bookworm" ]
    container:
      image:            perl:${{matrix.perl-version}}-${{matrix.foundation}}
    steps:
      - uses:           actions/checkout@v6
      - uses:           ./install-test-helper-deps/
      - run:            "cpm install CPAN::Test::Dummy::Perl5::Make"
        shell:          bash

  test-trixie:
    name:               "Test on trixie"
    runs-on:            ubuntu-latest
    needs:
      - perl-versions
    strategy:
      fail-fast:        true
      matrix:
        perl-version:   ${{ fromJSON (needs.perl-versions.outputs.trixie) }}
        foundation:     [ "slim-trixie" ]
    container:
      image:            perl:${{matrix.perl-version}}-${{matrix.foundation}}
    steps:
      - uses:           actions/checkout@v6
      - uses:           ./install-test-helper-deps/
      - run:            "cpm install CPAN::Test::Dummy::Perl5::Make"
        shell:          bash
